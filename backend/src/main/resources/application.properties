spring.application.name=student-course-graph

# Local Neo4j defaults for development. Override with environment variables if needed.
spring.neo4j.uri=${COGNODB_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${COGNODB_USERNAME:neo4j}
spring.neo4j.authentication.password=${COGNODB_PASSWORD:neo4j}

server.port=${PORT:8080}

